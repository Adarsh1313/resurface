name: Web — CI & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'

defaults:
  run:
    working-directory: web

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify production API URL
        run: |
          if grep -R --include="*.js" 'fetch("http://localhost:4000' .next/static .next/server; then
            echo "Production bundle fetches the localhost API URL"
            exit 1
          fi

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-build
    # Only deploy on pushes to main (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Sensitive Vercel env vars come back from `vercel pull` as "[SENSITIVE]".
      # The API URL isn't secret: drop it so the build uses web/.env.production.
      - name: Drop redacted API URL from pulled env
        run: |
          for f in .vercel/.env.production.local .env.production.local; do
            [ -f "$f" ] && sed -i '/^NEXT_PUBLIC_API_BASE_URL=/d' "$f" || true
          done

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # `vercel pull` writes Sensitive env vars as the literal "[SENSITIVE]";
      # fail before deploying if one leaked into the client bundle.
      - name: Verify no redacted env values in bundle
        run: |
          if grep -R --include="*.js" -l '\[SENSITIVE\]' .vercel/output/static; then
            echo "A Sensitive Vercel env var was baked into the bundle as [SENSITIVE]"
            exit 1
          fi

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
