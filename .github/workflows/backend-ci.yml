name: Backend — CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generate Prisma client from the schema so @prisma/client types
      # are available for TypeScript — no DB connection required.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Dummy URL — generate only reads the schema, never connects.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DATABASE_DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
