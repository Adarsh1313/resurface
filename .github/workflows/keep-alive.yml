name: Keep Render alive

# BACKUP ONLY. The primary scheduler is cron-job.org calling
# POST /v1/cron/tick every 10 minutes (see docs/cron-setup.md), which both
# wakes the free Render instance and runs reminders/digests. GitHub's
# scheduled workflows are best-effort (often delayed or skipped), so this just
# pings /ready (which also touches the database) as a fallback warm-up.

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes (best-effort)
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    name: Ping backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping ready endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -m 90 -w "%{http_code}" https://resurface-nclr.onrender.com/ready)
          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: ready check returned $STATUS"
          fi
