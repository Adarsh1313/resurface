<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --rs-bg-base: #0f0f0e;
      --rs-bg-surface: #161614;
      --rs-bg-elevated: #1e1e1b;
      --rs-bg-hover: #252520;
      --rs-border-subtle: rgba(255,255,255,0.06);
      --rs-border-default: rgba(255,255,255,0.10);
      --rs-text-primary: #f0ede8;
      --rs-text-secondary: #9b9690;
      --rs-text-tertiary: #5e5b57;
      --rs-teal-300: #5eead4;
      --rs-teal-400: #2dd4bf;
      --rs-teal-900: #042f2e;
      --rs-amber-400: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--rs-bg-base);
      color: var(--rs-text-primary);
      padding: 16px;
    }
    .header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
    }
    .header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--rs-teal-400);
      box-shadow: 0 0 10px rgba(45,212,191,0.6);
    }
    .header .title {
      font-size: 13px; font-weight: 500; letter-spacing: -0.01em;
      color: var(--rs-text-primary);
    }
    .header .word {
      margin-left: auto;
      font-size: 10px; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--rs-text-tertiary);
    }
    .section { display: none; }
    .field { font-size: 13px; color: var(--rs-text-secondary); margin-bottom: 8px; }
    .field strong { color: var(--rs-text-primary); font-weight: 500; }
    .label {
      font-size: 10px; font-weight: 500;
      color: var(--rs-text-tertiary);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .label .ai-pill {
      font-size: 9px; font-weight: 500;
      padding: 2px 6px; border-radius: 100px;
      background: rgba(45,212,191,0.10); color: var(--rs-teal-300);
      border: 0.5px solid rgba(45,212,191,0.18);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .stat {
      font-size: 28px; font-weight: 500; letter-spacing: -0.02em;
      color: var(--rs-teal-400); margin-bottom: 4px;
    }
    input, textarea, select {
      width: 100%;
      padding: 9px 10px;
      background: var(--rs-bg-elevated);
      color: var(--rs-text-primary);
      border: 0.5px solid var(--rs-border-default);
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 8px;
      font-family: inherit;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--rs-teal-400);
      box-shadow: 0 0 0 3px rgba(45,212,191,0.15);
    }
    textarea { resize: vertical; min-height: 60px; word-break: break-all; }
    input[type="datetime-local"] { color-scheme: dark; }
    /* Custom datetime picker */
    .dt-trigger {
      width: 100%;
      padding: 9px 10px;
      background: var(--rs-bg-elevated);
      color: var(--rs-text-secondary);
      border: 0.5px solid var(--rs-border-default);
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 8px;
      font-family: inherit;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dt-trigger:hover { border-color: var(--rs-border-default); color: var(--rs-text-primary); }
    .dt-trigger.active { color: var(--rs-text-primary); border-color: rgba(45,212,191,0.35); }
    .dt-trigger .clear {
      color: var(--rs-text-tertiary); font-size: 14px; line-height: 1;
      padding: 0 4px;
    }
    .dt-trigger .clear:hover { color: var(--rs-text-primary); }
    .dt-panel {
      background: var(--rs-bg-elevated);
      border: 0.5px solid var(--rs-border-default);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .dt-panel[hidden] { display: none; }
    .dt-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .dt-nav .month {
      font-size: 12px; font-weight: 500; color: var(--rs-text-primary);
    }
    .dt-nav button {
      width: 22px; height: 22px; padding: 0; margin: 0;
      background: transparent; color: var(--rs-text-secondary);
      border: 0.5px solid var(--rs-border-subtle); border-radius: 6px;
      font-size: 12px; line-height: 1;
    }
    .dt-nav button:hover { color: var(--rs-text-primary); background: var(--rs-bg-hover); }
    .dt-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .dt-grid .dow {
      font-size: 9px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--rs-text-tertiary);
      text-align: center; padding: 4px 0;
    }
    .dt-grid .day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--rs-text-secondary);
      border-radius: 6px; cursor: pointer;
      border: 0.5px solid transparent;
    }
    .dt-grid .day:hover { background: var(--rs-bg-hover); color: var(--rs-text-primary); }
    .dt-grid .day.muted { color: var(--rs-text-tertiary); opacity: 0.4; }
    .dt-grid .day.today { border-color: var(--rs-border-default); }
    .dt-grid .day.selected {
      background: var(--rs-teal-400); color: var(--rs-teal-900); font-weight: 500;
    }
    .dt-time {
      display: flex; gap: 6px; margin-top: 10px; align-items: center;
    }
    .dt-time .col {
      flex: 1; height: 96px; overflow-y: auto;
      background: var(--rs-bg-surface); border-radius: 6px;
      border: 0.5px solid var(--rs-border-subtle);
      scrollbar-width: thin;
    }
    .dt-time .col::-webkit-scrollbar { width: 4px; }
    .dt-time .col::-webkit-scrollbar-thumb { background: var(--rs-border-default); border-radius: 2px; }
    .dt-time .col .opt {
      padding: 5px 8px; font-size: 11px; color: var(--rs-text-secondary);
      text-align: center; cursor: pointer;
    }
    .dt-time .col .opt:hover { background: var(--rs-bg-hover); color: var(--rs-text-primary); }
    .dt-time .col .opt.selected {
      background: rgba(45,212,191,0.12); color: var(--rs-teal-300);
    }
    .dt-time .sep { color: var(--rs-text-tertiary); font-size: 14px; font-weight: 500; }
    .dt-set {
      width: 100%; margin-top: 10px;
      padding: 8px 10px;
      background: var(--rs-teal-400); color: var(--rs-teal-900);
      border: none; border-radius: 6px;
      font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .dt-set:hover { background: var(--rs-teal-300); }
    .dt-quick {
      display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap;
    }
    .dt-quick .qbtn {
      flex: 1; padding: 5px 6px; font-size: 10px;
      background: var(--rs-bg-surface); color: var(--rs-text-secondary);
      border: 0.5px solid var(--rs-border-subtle); border-radius: 6px;
      cursor: pointer; margin: 0;
    }
    .dt-quick .qbtn:hover { color: var(--rs-text-primary); border-color: var(--rs-border-default); }
    button {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      transition: background 150ms, color 150ms;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--rs-teal-400); color: var(--rs-teal-900);
    }
    .btn-primary:hover { background: var(--rs-teal-300); }
    .btn-secondary {
      background: transparent;
      color: var(--rs-text-secondary);
      border: 0.5px solid var(--rs-border-default);
    }
    .btn-secondary:hover { background: var(--rs-bg-hover); color: var(--rs-text-primary); }
    .btn-row { display: flex; gap: 8px; }
    .btn-row button { flex: 1; }
    .error { color: #f87171; font-size: 12px; margin-bottom: 6px; }
    a { color: var(--rs-teal-300); font-size: 12px; cursor: pointer; text-decoration: none; }
    a:hover { color: var(--rs-teal-400); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 100px;
      background: var(--rs-bg-elevated); color: var(--rs-text-secondary);
      font-size: 11px; font-weight: 500; cursor: pointer;
      border: 0.5px solid var(--rs-border-subtle);
      transition: all 150ms;
    }
    .chip:hover { color: var(--rs-text-primary); border-color: var(--rs-border-default); }
    .chip.selected {
      background: rgba(45,212,191,0.10);
      color: var(--rs-teal-300);
      border-color: rgba(45,212,191,0.35);
    }
    .chip .x { font-size: 10px; opacity: 0.6; }
    .title-preview {
      font-size: 13px; line-height: 1.4; color: var(--rs-text-primary);
      background: var(--rs-bg-elevated);
      border: 0.5px solid var(--rs-border-subtle);
      padding: 10px 12px; border-radius: 8px;
      margin-bottom: 8px; max-height: 64px; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    }
    .platform-pill {
      display: inline-flex; align-items: center;
      padding: 3px 8px; border-radius: 100px;
      font-size: 10px; font-weight: 500; margin-bottom: 10px;
      letter-spacing: 0.04em;
    }
    .platform-pill.x {
      background: rgba(255,255,255,0.07); color: #e7e4df;
      border: 0.5px solid rgba(255,255,255,0.12);
    }
    .platform-pill.youtube {
      background: rgba(255,64,64,0.10); color: #fca5a5;
      border: 0.5px solid rgba(255,64,64,0.18);
    }
    .muted { font-size: 11px; color: var(--rs-text-tertiary); }
    .divider {
      height: 0.5px; background: var(--rs-border-subtle);
      margin: 12px 0;
    }
    .logo-mark {
      display: inline-block; width: 12px; height: 16px;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="dot"></span>
    <span class="title">Saved to Resurface</span>
    <span class="word">Resurface</span>
  </div>

  <!-- Login -->
  <div id="login-section" class="section">
    <p class="field">Paste your token from the <a id="bridge-link" target="_blank">bridge page</a> to pair the extension.</p>
    <textarea id="token-input" placeholder="eyJhbGciOi..."></textarea>
    <div id="login-error" class="error" style="display:none"></div>
    <button id="paste-login-btn" class="btn-primary">Save token</button>
    <button id="open-bridge-btn" class="btn-secondary">Open bridge page</button>
  </div>

  <!-- Capture -->
  <div id="capture-section" class="section">
    <div id="capture-platform" class="platform-pill"></div>
    <div class="label">Title</div>
    <div id="capture-title" class="title-preview"></div>
    <div id="capture-author" class="muted" style="margin-bottom:10px"></div>

    <div class="label">Topics <span class="muted" id="suggest-status"></span></div>
    <div id="capture-topics" class="chip-row"></div>
    <input id="topic-custom" type="text" placeholder="Add your own and press Enter" />

    <div class="label" style="margin-top:4px">Reminder (optional)</div>
    <button type="button" id="dt-trigger" class="dt-trigger">
      <span id="dt-trigger-label">Set a reminder…</span>
      <span id="dt-trigger-clear" class="clear" hidden>×</span>
    </button>
    <div id="dt-panel" class="dt-panel" hidden>
      <div class="dt-quick">
        <button type="button" class="qbtn" data-quick="1h">+1 hour</button>
        <button type="button" class="qbtn" data-quick="tonight">Tonight</button>
        <button type="button" class="qbtn" data-quick="tomorrow">Tomorrow</button>
        <button type="button" class="qbtn" data-quick="weekend">Weekend</button>
      </div>
      <div class="dt-nav" style="margin-top:10px">
        <button type="button" id="dt-prev">‹</button>
        <span class="month" id="dt-month"></span>
        <button type="button" id="dt-next">›</button>
      </div>
      <div id="dt-grid" class="dt-grid"></div>
      <div class="dt-time">
        <div id="dt-hour" class="col"></div>
        <span class="sep">:</span>
        <div id="dt-min" class="col"></div>
      </div>
      <button type="button" id="dt-set" class="dt-set">Set reminder</button>
    </div>

    <div id="capture-error" class="error" style="display:none"></div>
    <div class="btn-row">
      <button id="capture-skip-btn" class="btn-secondary">Skip</button>
      <button id="capture-save-btn" class="btn-primary">Save</button>
    </div>
  </div>

  <!-- Dashboard/status -->
  <div id="dash-section" class="section">
    <p class="field">Signed in as <strong id="user-email"></strong></p>
    <p class="field">Saves today</p>
    <div class="stat" id="saves-today">0</div>
    <button id="dashboard-btn" class="btn-primary">Open Dashboard</button>
    <button id="logout-btn" class="btn-secondary">Log out</button>
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
