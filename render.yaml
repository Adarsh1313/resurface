services:
  - type: web
    name: resurface-api
    runtime: node
    rootDir: backend
    # Build: install all deps (--include=dev so @types/* are present for tsc),
    # generate Prisma client, apply migrations, compile TypeScript.
    # NODE_ENV=production would otherwise skip devDependencies and tsc would
    # fail with "cannot find declaration file for module 'express'" (exit 2).
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — do NOT hardcode secrets here:
      # Use the DIRECT (Session mode, port 5432) Supabase URL here.
      # pgbouncer/Transaction mode (port 6543) blocks DDL used by migrations.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: ALLOWED_ORIGINS
        sync: false           # Set to your Vercel URL in Render dashboard
      - key: ADMIN_EMAILS
        sync: false           # Comma-separated owner/admin emails for /dashboard/admin
      - key: REQUIRE_INVITE
        value: "true"         # Require admin-sent invite links for new beta signups
      - key: PUBLIC_APP_URL
        sync: false           # Your Vercel app URL, used in waitlist/invite emails
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
