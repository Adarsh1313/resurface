services:
  - type: web
    name: resurface-api
    runtime: node
    rootDir: backend
    # Build: install → generate Prisma client → push schema → compile TS
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — do NOT hardcode secrets here:
      # Use the DIRECT (Session mode, port 5432) Supabase URL here.
      # pgbouncer/Transaction mode (port 6543) blocks DDL used by migrations.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: ALLOWED_ORIGINS
        sync: false           # Set to your Vercel URL in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
